<!DOCTYPE html><html xmlns:th='http://www.thymeleaf.org'><head><title>Voice Input</title><link rel='stylesheet' href='/css/style.css'></head><body><div class='container'><h2>Voice Receiver</h2><button type='button' onclick='startRecognition()'>Start Voice Input</button><form action='/display' method='post'><textarea id='message' name='message' rows='8' cols='50'></textarea><br><button type='submit'>Send</button></form></div><script>function startRecognition(){const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRecognition){alert('Speech Recognition not supported');return;}const recognition=new SpeechRecognition();recognition.onresult=function(e){document.getElementById('message').value=e.results[0][0].transcript;};recognition.start();}</script></body></html>
